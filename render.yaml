# render.yaml — Blueprint specification for Render
services:
  - type: web
    name: adiona
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: "pip install -r requirements.txt || pip install -r backend/requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: DATABASE_URL
        sync: false   # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false   # set manually in Render dashboard
      - key: ADMIN_SECRET
        sync: false   # set manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /health
